# =====================================================================
# TRUCKLY — master configuration
# Every number that enters the simulation lives here, with a provenance
# tag and a source. Nothing is hard-coded in the modules.
#
# PROVENANCE TAGS
#   OBS = observed / external real-world data
#   BEN = published benchmark instance
#   SIM = generated by the Truckly synthetic layer
#   DRV = derived deterministically from other values
#   ASM = declared assumption, no external source obtained
#   OPT = produced by the optimiser / simulation
# =====================================================================

meta:
  project: TRUCKLY
  version: "1.0.0"
  master_seed: 20260816

# ---------------------------------------------------------------------
# NETWORK
# ---------------------------------------------------------------------
network:
  # Coordinates are real (public gazetteer / OpenStreetMap place nodes) -> OBS
  # Road distances are NOT from a live routing engine in this build.
  # See docs/limitations.md. Circuity + speed model -> ASM.
  distance_model: "haversine_x_circuity"
  circuity:                      # ASM: road km / great-circle km
    short_lt_50km: 1.35
    mid_50_200km: 1.25
    long_gt_200km: 1.18
  speeds_kmh:                    # ASM: average truck speeds incl. stops
    short_lt_50km: 38.0
    mid_50_200km: 48.0
    long_gt_200km: 55.0

# ---------------------------------------------------------------------
# COST MODEL  (all ASM unless stated)
# ---------------------------------------------------------------------
cost:
  diesel_price_inr_per_litre: 90.0   # ASM base case; see docs for sourcing note
  toll_inr_per_km: 1.60              # ASM
  driver_wage_inr_per_hour: 130.0    # ASM
  fixed_cost_inr_per_trip: 2500.0    # ASM: depreciation + insurance apportioned
  waiting_cost_multiplier: 1.0       # multiplies driver wage during idle waiting
  co2_kg_per_litre_diesel: 2.68      # ASM in this build. Replace with a cited
                                     # DESNZ/EPA factor before submission.
  # Freight tariff (ASM): a blended per-km + per-tonne-km backhaul rate.
  # This replaces an arbitrary "unserved shipment penalty" with the actual
  # economic prize for serving a load, which is what makes this a genuine
  # PRIZE-COLLECTING (selective) problem rather than a penalty-tuned one.
  tariff_inr_per_km: 20.0
  tariff_inr_per_tonne_km: 3.0
  tariff_base_inr: 600.0
  empty_km_penalty_inr_per_km: 6.0   # ASM: managerial penalty on empty running.
        # This is an OBJECTIVE term, not an accounting cost. Fleet operators
        # manage empty running as a KPI in its own right: an empty kilometre
        # consumes vehicle life, tyres and fleet availability that the fuel and
        # driver terms do not capture. It is applied IDENTICALLY to every policy
        # (B1, B2 and TRUCKLY all optimise the same objective), and reported
        # total_cost_inr excludes it so the money figures stay real.
        # The cost-component ablation reports results with this term set to 0.

# ---------------------------------------------------------------------
# FLEET TYPES  (ASM: representative Indian road-freight classes)
# ---------------------------------------------------------------------
truck_types:
  LCV_3T:
    capacity_kg: 3000
    capacity_m3: 14.0
    base_fuel_l_per_100km: 14.0     # unladen
    load_fuel_coeff_l_per_100km_per_t: 1.10
    share: 0.20
  RIGID_9T:
    capacity_kg: 9000
    capacity_m3: 34.0
    base_fuel_l_per_100km: 21.0
    load_fuel_coeff_l_per_100km_per_t: 0.85
    share: 0.35
  RIGID_16T:
    capacity_kg: 16000
    capacity_m3: 52.0
    base_fuel_l_per_100km: 26.0
    load_fuel_coeff_l_per_100km_per_t: 0.72
    share: 0.28
  ARTIC_25T:
    capacity_kg: 25000
    capacity_m3: 78.0
    base_fuel_l_per_100km: 31.0
    load_fuel_coeff_l_per_100km_per_t: 0.62
    share: 0.17

# ---------------------------------------------------------------------
# FUEL MODEL EXTRAS
# ---------------------------------------------------------------------
fuel_model:
  road_factor_coeff_gamma: 6.0     # ASM: L/100km per unit of road-difficulty
  road_factor_mean: 0.5            # terrain/congestion index in [0,1]
  road_factor_sd: 0.18
  noise_lognormal_sigma: 0.085     # driver behaviour / weather / vehicle condition

# ---------------------------------------------------------------------
# DRIVER RULES (ASM — declared, not sourced from a statutory instrument)
# ---------------------------------------------------------------------
driver:
  max_driving_hours: 10.0
  max_duty_hours: 13.0
  break_after_hours: 5.0
  break_duration_min: 30.0

# ---------------------------------------------------------------------
# SCENARIOS
# ---------------------------------------------------------------------
scenario_defaults:
  n_trucks: 30
  shipment_density: 6.0        # open loads offered per available truck
                               # (a real freight exchange shows a returning
                               #  truck many loads, not one)
  detour_tolerance: 0.35       # theta: max fraction over direct return distance
  min_detour_allowance_km: 60.0  # ASM: operators think in absolute km too.
                               # allowance = max(theta*d_ret, this)
  deadline_slack_factor: 1.8   # deadline = ready + slack_factor * direct duration
  demand_asymmetry: 0.62       # P(shipment is headhaul source->sink)
  gravity_beta: 1.8            # ASM: OD deterrence exponent (gravity model)
  max_wait_hours: 6.0          # global cap on pre-departure idle waiting
  weight_lognorm_mu: 7.75      # ln(kg); median ~2320 kg
  weight_lognorm_sigma: 0.62
  density_kg_per_m3: 260.0     # ASM freight density -> volume from weight
  density_cv: 0.35
  service_time_pickup_min: 45.0
  service_time_delivery_min: 40.0
  max_bundle_size: 2
  n_instances: 100

scenarios:
  S0_base:        {}
  S1_low_avail:   {shipment_density: 2.0}
  S2_mod_avail:   {shipment_density: 6.0}
  S3_high_avail:  {shipment_density: 15.0}
  S4_strict_dl:   {deadline_slack_factor: 1.25}
  S5_relaxed_dl:  {deadline_slack_factor: 3.0}
  S6_low_util:    {weight_lognorm_mu: 7.05}
  S7_high_util:   {weight_lognorm_mu: 8.35}
  S8_small_trucks: {fleet_mix: {LCV_3T: 0.45, RIGID_9T: 0.40, RIGID_16T: 0.15, ARTIC_25T: 0.0}}
  S9_large_trucks: {fleet_mix: {LCV_3T: 0.0, RIGID_9T: 0.15, RIGID_16T: 0.40, ARTIC_25T: 0.45}}
  S10a_detour_15: {detour_tolerance: 0.15}
  S10b_detour_50: {detour_tolerance: 0.50}

# ---------------------------------------------------------------------
# SCORING WEIGHTS (used by B2 greedy + user-facing explanation)
# ---------------------------------------------------------------------
score_weights:
  w1_empty_avoided: 1.00
  w2_detour: 0.55
  w3_capacity: 0.70
  w4_waiting: 0.35
  w5_slack: 0.20

# ---------------------------------------------------------------------
# EXPERIMENT
# ---------------------------------------------------------------------
experiment:
  policies: ["B0_empty", "B1_wait_2h", "B1_wait_6h", "B1_wait_12h", "B2_greedy", "TRUCKLY"]
  bootstrap_resamples: 10000
  under_utilisation_threshold_pct: 25.0
